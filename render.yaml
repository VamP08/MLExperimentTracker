# The public demo: the dashboard over a recorded API snapshot, as a static site so it never cold-starts.
services:
  - type: web
    name: mlexperimenttracker-demo
    runtime: static
    # Captured here so the snapshot holds container paths, not a home directory; the grep
    # refuses to publish the empty placeholder. Never upload a locally built dist.
    buildCommand: |
      set -e
      python -m pip install --upgrade pip
      pip install -e ".[server,system]" httpx
      python scripts/build_demo_snapshot.py
      cd ml_frontend && npm ci && npm run build:demo
      if grep -rq "not captured yet" dist; then echo "demo snapshot is the empty placeholder; the capture did not run" >&2; exit 1; fi
    staticPublishPath: ml_frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      # Client-side routes have no file behind them, so every path falls back to the app.
      - type: rewrite
        source: /*
        destination: /index.html

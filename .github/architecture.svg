<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"><title>MLExperimentTracker architecture</title><rect width="1200" height="440" fill="#f5f7fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs><rect x="24" y="64" width="268" height="168" rx="10" fill="#ffffff" stroke="#d3d7dd" stroke-width="1.5"/><text x="42" y="96" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e2733">Your training script</text><text x="42" y="122" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">The SDK, with no dependencies</text><text x="42" y="142" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">in the base install.</text><text x="42" y="166" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">run = met.init(...)</text><text x="42" y="185" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">run.log({...}, step)</text><text x="42" y="204" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">run.finish()</text><rect x="360" y="32" width="312" height="376" rx="10" fill="#f8fafd" stroke="#d3d7dd" stroke-width="1.5"/><text x="378" y="64" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e2733">Run folders on your disk</text><text x="378" y="90" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">Plain JSON and JSONL, one folder per</text><text x="378" y="110" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">run. No database, no tracking server.</text><text x="378" y="134" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">&lt;project&gt;/&lt;run_id&gt;/</text><text x="394" y="153" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">metadata.json</text><text x="394" y="172" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">config.json</text><text x="394" y="191" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">metrics.jsonl</text><text x="394" y="210" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">summary.json</text><text x="394" y="229" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">artifacts.jsonl</text><text x="394" y="248" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">provenance.json</text><text x="394" y="267" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">uncommitted.patch</text><text x="394" y="286" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#1e2733">logs.jsonl</text><rect x="740" y="64" width="196" height="168" rx="10" fill="#ffffff" stroke="#d3d7dd" stroke-width="1.5"/><text x="758" y="96" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e2733">mlexp ui</text><text x="758" y="122" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">FastAPI on localhost.</text><text x="758" y="142" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">Reads the folders; three</text><text x="758" y="162" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">PATCH routes write tags</text><text x="758" y="182" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">and descriptions.</text><rect x="1000" y="64" width="176" height="168" rx="10" fill="#ffffff" stroke="#d3d7dd" stroke-width="1.5"/><text x="1018" y="96" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e2733">Dashboard</text><text x="1018" y="122" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">React, built into the</text><text x="1018" y="142" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">package, served from</text><text x="1018" y="162" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">the same origin.</text><rect x="740" y="280" width="436" height="128" rx="10" fill="#ffffff" stroke="#d3d7dd" stroke-width="1.5"/><text x="758" y="312" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e2733">mlexp verify  ·  mlexp replay</text><text x="758" y="338" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">Compares what a run recorded (commit, diff, packages,</text><text x="758" y="358" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">dataset hashes) with now: ok, drifted or unverifiable.</text><text x="758" y="378" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#56606c">Replay rebuilds the commit in a new git worktree.</text><path d="M292 148L356 148" stroke="#2563eb" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="324" y="138" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">writes</text><path d="M672 148L736 148" stroke="#2563eb" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="704" y="138" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">reads</text><path d="M936 148L996 148" stroke="#2563eb" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="966" y="138" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">/api</text><path d="M672 344L736 344" stroke="#2563eb" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="704" y="334" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">reads</text></svg>

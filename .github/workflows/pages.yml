name: Pages

# ----------------------------------------------------------------------------------------
# Builds the static demo and publishes it to GitHub Pages.
#
# The demo is the same React dashboard as the shipped one, built with `--mode demo` so its
# data layer reads a bundled snapshot instead of the HTTP API. The snapshot is produced
# here, on every deploy, by `scripts/build_demo_snapshot.py` — it runs `mlexp demo` to
# create real runs and captures the real API's responses over them. Nothing in the demo is
# hand-written JSON, and regenerating it on every deploy is what keeps that true: a payload
# shape that changes in the server changes here too, or this job fails.
#
# THIS WORKFLOW WILL NOT RUN YET, AND THAT IS NOT A FAULT. It needs two things that are not
# in the repository's gift:
#
#   1. A remote. Until the repository is pushed to GitHub there is nothing to run it.
#   2. Pages enabled, with Actions as the source:
#        Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#      Without that, the deploy step fails with a 404 from the Pages API. The build job
#      still passes, so a red run here means "Pages is not switched on", not "the demo is
#      broken".
#
# The published URL is https://<owner>.github.io/MLExperimentTracker/ — the trailing path
# is why the demo build sets Vite's `base` and the router's basename. Renaming the
# repository means changing DEMO_BASE in ml_frontend/vite.config.ts.
# ----------------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

# `deploy-pages` proves who it is with an OIDC token, hence `id-token: write`; `pages:
# write` is what lets it publish. Everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and an in-flight one is never cancelled: interrupting an upload
# can leave the live site serving a half-written artifact, which is worse than being a
# commit behind for a minute.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ml_frontend/package-lock.json

      # `server` for the API the snapshot is captured from; `system` so the runs carry CPU
      # and memory samples and the demo shows those panels with real numbers rather than
      # empty ones. No GPU on a hosted runner, so GPU series are legitimately absent.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,system]"

      - name: Generate the demo snapshot from real runs
        run: python scripts/build_demo_snapshot.py

      - name: Install frontend dependencies
        working-directory: ml_frontend
        run: npm ci

      - name: Build the demo bundle
        working-directory: ml_frontend
        run: npm run build:demo

      # Three things that are wrong only in ways you cannot see on the landing page, so
      # they are asserted against the built artifact rather than trusted.
      - name: Check the artifact before publishing it
        run: |
          # 1. The SPA fallback. Pages has no rewrite, so 404.html is what makes a deep
          #    link like /MLExperimentTracker/runs/<id> load the app instead of GitHub's
          #    error page. Without it the site works until the first refresh.
          if [ ! -f ml_frontend/dist/404.html ]; then
            echo "::error::ml_frontend/dist/404.html is missing — deep links would 404 on Pages."
            exit 1
          fi

          # 2. The base path. A project site lives under /<repo>/; a bundle built with
          #    base '/' loads nothing at all there.
          if ! grep -q '/MLExperimentTracker/assets/' ml_frontend/dist/index.html; then
            echo "::error::dist/index.html does not reference /MLExperimentTracker/assets/ — the demo was built with the wrong base."
            exit 1
          fi

          # 3. The snapshot is real. ml_frontend/src/demo/snapshot.json is a committed
          #    placeholder that the step above is supposed to overwrite with runs captured
          #    from the API. If the script wrote somewhere else, the build still succeeds
          #    and publishes an empty dashboard labelled as a demo of real runs — which is
          #    the one failure this project must never ship. Checked against the bundle, so
          #    it stays correct whatever path the two sides agree on.
          if grep -rqF 'not captured yet' ml_frontend/dist; then
            echo "::error::the bundle still contains the placeholder snapshot — build_demo_snapshot.py did not write the file ml_frontend/src/lib/demoData.ts imports."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ml_frontend/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

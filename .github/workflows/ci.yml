name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------------------
  # The Python package: SDK, storage, server, CLI, provenance.
  #
  # Windows is in the matrix on purpose, not for symmetry. The one shipped defect this
  # test suite ever missed was a line-ending bug: `mlexp verify` forced
  # `core.autocrlf=false` onto somebody else's worktree, so a stock Windows checkout was
  # reported as DRIFTED one second after capture. 429 tests passed over it because every
  # test repository pinned `core.autocrlf=false` and wrote LF from Python, so the CRLF
  # case could not arise. A Linux-only CI would have passed over it too. Nothing here may
  # normalise line endings on checkout or configure git globally: the point of the Windows
  # leg is that it runs under the configuration a Windows user actually has, which is
  # `core.autocrlf=true` from Git for Windows' system config.
  # ------------------------------------------------------------------------------------
  python:
    name: python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      # Full history: the provenance tests build real git repositories and the verify and
      # replay paths walk commits, so a depth-1 checkout is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Lint
        run: ruff check src tests

      # -rs prints the reason for every skipped test in the summary, so a skip is always
      # visible in the log rather than folded into a count.
      - name: Test
        run: pytest tests -rs -p no:cacheprovider

  # ------------------------------------------------------------------------------------
  # The dashboard. One leg: it is the same bundle on every platform, and the build is a
  # tsc project reference build, so a type error fails here rather than at wheel time.
  # ------------------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ml_frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MLExperimentTracker">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3fae"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy="0" r="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".35" stop-color="#bfe3ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#sheen)"/>
  <!-- Many runs start apart and converge on one result. -->
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
    <path d="M9 13C27 13 29 32 47 32" opacity=".35"/>
    <path d="M9 22.5C27 22.5 29 32 47 32" opacity=".55"/>
    <path d="M9 32H47" opacity=".95"/>
    <path d="M9 41.5C27 41.5 29 32 47 32" opacity=".55"/>
    <path d="M9 51C27 51 29 32 47 32" opacity=".35"/>
  </g>
  <circle cx="48" cy="32" r="12" fill="url(#glow)"/>
  <circle cx="48" cy="32" r="4.2" fill="#fff"/>
</svg>
